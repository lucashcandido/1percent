  const rules=S.rules.filter(r=>r.kw&&r.cat).map(r=>`„${r.kw}“ → ${r.cat}`).join('; ');
  const seen=new Set(),ex=[];

async function aiCategorize(rows,onProgress){
  if(!rows.length)return 0;
  const lines=rows.map((r,i)=>`${i}\t${r.date}\t${r.amount.toFixed(2)}\t${r.desc.slice(0,160)}`).join('\n');

  let n=0;

  return n;
}

function asstFilter(a){
  let l=S.tx.slice();

  if(a.text){const q=norm(a.text);l=l.filter(t=>norm(t.desc+' '+(t.note||'')).includes(q))}
  if(a.category!==undefined)l=l.filter(t=>(t.category||'')===a.category);
  if(a.account!==undefined)l=l.filter(t=>(t.account||'')===a.account);
  if(a.type)l=l.filter(t=>typeOf(t.amount)===a.type);
  if(typeof a.min_amount==='number')l=l.filter(t=>Math.abs(t.amount)>=a.min_amount);

    const l=asstFilter(a).filter(t=>!isXfer(t)),g={};

  const m=asst.messages;let starts=[];m.forEach((x,i)=>{if(x.role==='user'&&typeof x.content==='string')starts.push(i)});
  const from=starts.length>3?starts[starts.length-3]:0,msgs=m.slice(from).map(x=>({...x}));

  return msgs;
}

const TOOL_LABEL={find_transactions:'sucht Buchungen',summarize:'rechnet',update_transactions:'ändert Buchungen',set_categories:'ordnet Kategorien zu',delete_transactions:'löscht Buchungen',add_transaction:'legt eine Buchung an',add_rule:'legt eine Regel an'};
async function asstSend(text){
  if(asst.busy||!text.trim())return;
  if(!aiKey()){asstAdd('bot','Für den Assistenten brauche ich deinen Claude-API-Schlüssel – trag ihn unter **Sync & Daten → Claude** ein.');return}
  asst.busy=true;asst.turnSnap=null;asstAdd('user',text);
  asst.messages.push({role:'user',content:text});
  const status=asstAdd('status','denkt nach …');
  let changes=0;
  try{
    for(let step=0;step<6;step++){
      const r=await asstCall();
      asst.messages.push({role:'assistant',content:r.content});
      const uses=(r.content||[]).filter(b=>b.type==='tool_use');
      const txt=(r.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      if(!uses.length||r.stop_reason!=='tool_use'){if(txt)asstAdd('bot',txt);break}
      const results=[];
      for(const u of uses){
        status.textContent=TOOL_LABEL[u.name]||'arbeitet';
        let out;try{out=asstRun(u.name,u.input)}catch(e){out={error:String(e.message||e)}}
        if(out.changed||out.deleted||out.created||(u.name==='add_rule'&&out.ok))changes+=(out.changed||out.deleted||1);
        results.push({type:'tool_result',tool_use_id:u.id,content:JSON.stringify(out)});
      }
      asst.messages.push({role:'user',content:results});
      if(step===9)asstAdd('bot','(Ich habe aufgehört, weil es zu viele Schritte wurden – sag mir, wie ich weitermachen soll.)');
    }

  status.remove();

  if(asst.turnSnap){

    asst.undo=asst.turnSnap;asst.turnSnap=null;
    const u=asstAdd('undo','');u.innerHTML='<button class="linkbtn" style="width:auto">↶ Änderungen rückgängig machen</button>';

async function gh(c,method,path,body,extra){

      headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{}),...(extra||{})},

let dirTag='',lastItems=[],backoffUntil=0;
async function syncNow(quiet){
  const c=cfg();if(!c){setSync('off');return}
  if(syncing){if(!quiet)again=true;return}
  syncing=true;if(!quiet)setSync('busy');let changed=false,retry=false;
  try{
    for(let attempt=0;;attempt++){
      stamp();
      /* bedingte Abfrage: unveränderte Daten → 304, zählt nicht gegen das GitHub-Kontingent */
      const ls=await gh(c,'GET','/contents/data',null,dirTag&&attempt===0?{'If-None-Match':dirTag}:null);
      let items;
      if(ls.status===304)items=lastItems;
      else{items=ls.status===404?[]:ls.json.filter(x=>x.type==='file'&&/^(\d{4}-\d{2}|settings|workouts|todos)\.json$/.test(x.name));dirTag=ls.etag||'';lastItems=items}
      const names=new Set(items.map(x=>x.name));
      for(const n of Object.keys(R))if(!names.has(n))delete R[n];
      for(const it of items){
        if(R[it.name]&&R[it.name].sha===it.sha)continue;
        const f=await gh(c,'GET','/contents/data/'+it.name);
        const content=b64d(f.json.content);
        R[it.name]={sha:f.json.sha,content};
        if(mergeFile(it.name,content))changed=true;
      }
      const months=new Set([...S.tx,...S.tomb].map(t=>t.date.slice(0,7)));
      Object.keys(R).forEach(n=>{if(/^\d{4}-\d{2}\.json$/.test(n))months.add(n.slice(0,7))});
      const jobs=[];
      for(const m of [...months].sort()){
        const n=m+'.json',s=serMonth(m);
        const has=S.tx.some(t=>t.date.startsWith(m))||S.tomb.some(t=>t.date.startsWith(m));
        if((R[n]?R[n].content:null)!==s&&(R[n]||has))jobs.push([n,s,m]);
      }
      const ss=serSettings();
      if(!R['settings.json']||R['settings.json'].content!==ss)jobs.push(['settings.json',ss,'Einstellungen']);
      const ws=serWorkouts();
      if((S.wo.length||S.wtomb.length||R['workouts.json'])&&(!R['workouts.json']||R['workouts.json'].content!==ws))jobs.push(['workouts.json',ws,'Training']);
      const tds=serTodos();
      if((S.todo.length||S.ttomb.length||R['todos.json'])&&(!R['todos.json']||R['todos.json'].content!==tds))jobs.push(['todos.json',tds,'ToDos']);
      let conflict=false;
      for(const [n,s,label] of jobs){
        try{
          const r=await gh(c,'PUT','/contents/data/'+n,{message:`1Percent: ${label} aktualisiert`,content:b64e(s),...(R[n]?{sha:R[n].sha}:{})});
          R[n]={sha:r.json.content.sha,content:s};
        }catch(e){if(e.status===409||e.status===422){conflict=true;delete R[n];break}throw e}
      }
      if(!conflict)break;
      if(attempt>=3)throw new Error('Konflikt beim Speichern – bitte erneut versuchen');
    }
    persist();persistR();backoffUntil=0;
    setSync('ok');
    if(changed)render();
  }catch(e){
    dirTag='';backoffUntil=Date.now()+(e.status===403?120000:30000);
    setSync('err',e.offline?'Offline – Änderungen werden später synchronisiert':e.status===401?'Token ungültig oder abgelaufen – neuen Token erstellen und das Gerät neu verbinden (Sync → Token ersetzen)':e.message);
  }finally{
    syncing=false;if(retry||again){again=false;syncNow()}
  }
}
function setSync(s,msg){syncState={s,msg:msg||'',at:s==='ok'?new Date():syncState.at};updateSyncStatus()}

  const b=$('#syncBtn');if(!b)return;

  const txt={local:'Nur lokal',busy:'Sync …',error:'Sync-Problem',ok:'Synchron'+(at?' '+at:'')}[st];
  b.className='pill '+st;b.title=(st==='local'?'Sync einrichten':st==='error'?syncState.msg:'Synchronisiert'+(at?' um '+at:''))||'';

/* ============ Gerätezugang per Code (wie Castcomercial) ============
   Das erste Gerät verschlüsselt {repo, token} mit einem 12-stelligen Code (PBKDF2 600 000 → AES-GCM) und legt das Ergebnis
   als access/<id>.json ins öffentliche App-Repo. <id> wird ebenfalls langsam aus dem Code abgeleitet (PBKDF2, anderes Salz),
   damit sich der Code nicht über den Dateinamen erraten lässt. Ein neues Gerät braucht nur den Code (oder den QR-Code mit #c=…).
   Ältere Links mit #a=… funktionieren weiter. Der Code steht in den synchronisierten Einstellungen des privaten Daten-Repos. */
const LOCAL_KEY='1percent-local',PEND_KEY='1percent-pending-blob',ACCESS_IT=600000;
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789',CODE_LEN=12;     /* ohne 0/O, 1/I/L: gut abzutippen */
const cleanCode=s=>String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const showCode=c=>cleanCode(c).slice(0,CODE_LEN).replace(/(.{4})(?=.)/g,'$1-');
function newCode(){let o='';while(o.length<CODE_LEN)for(const x of crypto.getRandomValues(new Uint8Array(24)))if(x<248&&o.length<CODE_LEN)o+=CODE_CHARS[x%31];return o}
const bytesToB64=b=>{let o='';b.forEach(x=>o+=String.fromCharCode(x));return btoa(o)};
const b64ToBytes=s=>Uint8Array.from(atob(String(s)),c=>c.charCodeAt(0));
const b64url=s=>s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return s};
const blobToParam=blob=>b64url(btoa(JSON.stringify(blob)));
const paramToBlob=p=>JSON.parse(atob(unb64url(p)));
async function codeKey(code,salt,it){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(cleanCode(code)),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealAccess(code,conf){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await codeKey(code,salt,ACCESS_IT);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({repo:conf.repo,token:conf.token})));
  return {v:1,it:ACCESS_IT,salt:bytesToB64(salt),iv:bytesToB64(iv),ct:bytesToB64(new Uint8Array(ct))};
}
async function openAccess(code,blob){
  if(!blob||blob.v!==1||!Number.isInteger(blob.it)||blob.it<100000||blob.it>5000000)throw new Error('format');
  const key=await codeKey(code,b64ToBytes(blob.salt),blob.it);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(blob.iv)},key,b64ToBytes(blob.ct));
  const conf=JSON.parse(new TextDecoder().decode(plain));
  if(!conf||typeof conf.token!=='string'||!/^[\w.-]+\/[\w.-]+$/.test(conf.repo||''))throw new Error('format');
  return {repo:conf.repo,token:conf.token};
}
async function pairLink(withCode){
  const c=cfg(),code=S.access&&S.access.code;if(!c||!code)return '';
  return location.origin+location.pathname+'#a='+blobToParam(await sealAccess(code,c))+(withCode?'&c='+cleanCode(code):'');
}
const codeLink=code=>location.origin+location.pathname+'#c='+cleanCode(code);
/* Öffentliches App-Repo, in dem die verschlüsselten Zugänge liegen (aus der Pages-Adresse abgeleitet). */
function appRepo(){
  const h=location.hostname,m=/^([\w-]+)\.github\.io$/i.exec(h);
  if(m){const seg=location.pathname.split('/').filter(Boolean)[0];return m[1]+'/'+(seg&&!/\.html?$/.test(seg)?seg:m[1]+'.github.io')}
  return 'lucashcandido/1percent';
}
async function accessId(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(cleanCode(code)),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('1percent-access-id'),iterations:ACCESS_IT,hash:'SHA-256'},base,128);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const sha16=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('');
let accessErr='',accessBusy=null;
/* Legt den Zugang für den aktuellen Code ins App-Repo (bzw. aktualisiert ihn nach einem Token-Wechsel). */
async function publishAccess(force){
  const c=cfg(),code=S.access&&S.access.code;if(!c||!code||!crypto.subtle)return false;
  const tk=await sha16(c.repo+'|'+c.token);
  if(!force&&S.access.pub===tk&&S.access.id)return true;
  if(accessBusy)return accessBusy;
  accessBusy=(async()=>{
    try{
      const id=S.access.id||await accessId(code),ar={repo:appRepo(),token:c.token},path=`/contents/access/${id}.json`;
      const blob=await sealAccess(code,c);
      const cur=await gh(ar,'GET',path);
      await gh(ar,'PUT',path,{message:'1Percent: Gerätezugang',content:b64e(JSON.stringify(blob)+'\n'),...(cur.status===200?{sha:cur.json.sha}:{})});
      S.access.id=id;S.access.pub=tk;accessErr='';save();return true;
    }catch(e){
      accessErr=e.offline?'Keine Verbindung zu GitHub – wird beim nächsten Sync nachgeholt.':(e.status===403||e.status===404||e.status===401)?'noperm':(e.message||'Fehler');
      return false;
    }finally{accessBusy=null}
  })();
  return accessBusy;
}
async function removeAccess(id){
  const c=cfg();if(!c||!id)return;
  try{const ar={repo:appRepo(),token:c.token},path=`/contents/access/${id}.json`,cur=await gh(ar,'GET',path);
    if(cur.status===200)await gh(ar,'DELETE',path,{message:'1Percent: alten Gerätezugang entfernt',sha:cur.json.sha})}catch(e){}
}
async function fetchAccess(code){
  const id=await accessId(code);

/* Prüft Repo + Token und verbindet dieses Gerät. Gibt '' oder eine Fehlermeldung zurück. */
async function connect(repo,token){
  try{
    const r=await gh({repo,token},'GET','');
    if(r.status===404)return 'Repo nicht gefunden – oder der Token hat keinen Zugriff darauf.';
    if(r.json.private!==true)return '⚠ Dieses Repo ist ÖFFENTLICH. Deine Finanzdaten wären für alle sichtbar – bitte ein privates Repo verwenden.';
    if(r.json.permissions&&r.json.permissions.push===false)return 'Der Token hat nur Lesezugriff – er braucht „Contents: Read and write“.';
  }catch(e){return e.offline?'Keine Verbindung zu GitHub.':e.message}
  localStorage.setItem(CFG_KEY,JSON.stringify({repo,token}));R={};persistR();
  render();syncNow();return '';
}
const pendingBlob=()=>{try{return localStorage.getItem(PEND_KEY)||''}catch(e){return ''}};
async function unlockWithCode(code,param){
  code=cleanCode(code);
  if(!window.crypto||!crypto.subtle)return 'Dieser Browser unterstützt die Verschlüsselung hier nicht (HTTPS nötig).';
  if(code.length!==CODE_LEN)return 'Bitte den vollständigen Code eingeben (12 Zeichen).';
  const p=param||pendingBlob();let conf;
  if(p){try{conf=await openAccess(code,paramToBlob(p))}catch(e){}}
  if(!conf){
    let blob;try{blob=await fetchAccess(code)}catch(e){}
    if(!blob)return 'Code unbekannt. Prüfe den Code – er steht auf deinem ersten Gerät unter Sync & Daten → Weitere Geräte.';
    try{conf=await openAccess(code,blob)}catch(e){return 'Code falsch.'}
  }
  const err=await connect(conf.repo,conf.token);
  if(err)return err;
  try{localStorage.removeItem(PEND_KEY)}catch(e){}
  return '';
}

function bindLogin(){
  const inp=$('#codeIn');
  inp.oninput=()=>{if(!/[#&?=]|http/i.test(inp.value))inp.value=showCode(inp.value)};
  inp.onkeydown=e=>{if(e.key==='Enter')submitCode(inp.value)};
  $('#codeGo').onclick=()=>submitCode(inp.value);
  $('#codeAdmin').onclick=openData;
  $('#codeLocal').onclick=()=>{try{localStorage.setItem(LOCAL_KEY,'1')}catch(e){}render()};
}
async function submitCode(value){
  const btn=$('#codeGo'),msg=$('#codeMsg');
  if(btn&&btn.disabled)return;
  const pi=parseInput(String(value||''));
  if(pi.a&&!pi.c){try{paramToBlob(pi.a);localStorage.setItem(PEND_KEY,pi.a)}catch(e){}if($('#codeIn')){render();toast('Link erkannt – jetzt den Code eingeben')}return}
  if(btn){btn.disabled=true;btn.textContent='Prüfe Code…'}
  if(msg)msg.innerHTML='';
  const err=await unlockWithCode(pi.c||value,pi.a);
  if(!err){closeModal();toast('Gerät verbunden – lade deine Daten…');return}
  const b=$('#codeGo');if(b){b.disabled=false;b.textContent='Verbinden'}
  const m=$('#codeMsg');if(m)m.innerHTML=`<div class="warn">${esc(err)}</div>`;else toast(err);
}
/* Start: QR-Code/Link (#c=CODE, ältere Links #a=…&c=…) verbindet das Gerät ohne Tippen. */
async function startAccess(){
  const h=new URLSearchParams(location.hash.slice(1)),a=h.get('a'),c=h.get('c');
  if(!a&&!c)return;
  history.replaceState(null,'',location.pathname+location.search);       /* der Code bleibt nicht in der Adresszeile */
  if(cfg())return;
  if(a){try{paramToBlob(a);localStorage.setItem(PEND_KEY,a)}catch(e){}}
  if(!c){render();return}
  if(!isLocked()){const err=await unlockWithCode(c,a);toast(err||'Gerät verbunden – lade deine Daten…');return}
  render();const i=$('#codeIn');if(i)i.value=showCode(c);
  await submitCode(c);
}

let qrReady=null;
const loadQr=()=>qrReady||(qrReady=new Promise((ok,no)=>{if(window.qrcode)return ok();const sc=document.createElement('script');sc.src='qrcode.js';sc.onload=ok;sc.onerror=()=>{qrReady=null;no()};document.head.appendChild(sc)}));
function qrSvg(text){
  const q=qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),m=4,all=n+2*m;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${all} ${all}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="${all}" height="${all}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
async function showQr(){
  try{await loadQr()}catch(e){return toast('QR-Code konnte nicht geladen werden.')}
  const url=accessErr==='noperm'?await pairLink(true):codeLink(S.access.code);
  modal(`<div style="text-align:center"><h3>Neues Gerät verbinden</h3><p class="muted">Mit der Kamera des neuen Geräts scannen – fertig. Nicht weitergeben: der QR-Code enthält deinen Code.</p><div class="qrbox">${qrSvg(url)}</div><div class="row" style="margin-top:14px;justify-content:center"><button class="primary" id="qr_close">Fertig</button></div></div>`,'sm');
  $('#qr_close').onclick=()=>{closeModal();openData()};
}
async function copyText(text,ok){try{await navigator.clipboard.writeText(text);toast(ok)}catch(e){prompt('Zum Kopieren:',text)}}

    <div id="ac_state" class="muted" style="margin:4px 0 8px">${ready?'<span class="ok">✓ Bereit – der Code funktioniert auf jedem Gerät.</span>':accessErr==='noperm'?`<div class="warn">⚠ Der Code kann noch nicht bereitgestellt werden: Dein Token braucht zusätzlich Zugriff auf das App-Repo <b>${esc(appRepo())}</b>. Auf GitHub beim Token unter <i>Repository access</i> dieses Repo hinzufügen (Contents: Read and write), dann hier „Erneut versuchen“. <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">Token bearbeiten</a><br>Bis dahin funktioniert der QR-Code / Link (enthält den Zugang direkt).</div><button id="ac_retry" type="button">Erneut versuchen</button>`:accessErr?esc(accessErr):'Code wird bereitgestellt…'}</div>
    <div class="row"><button class="primary" id="ac_qr">QR-Code zeigen</button><button id="ac_copy">Code kopieren</button><button id="ac_link">Link kopieren</button><button id="ac_new">Neuen Code</button></div>

  return `<h4>Weitere Geräte</h4>`+(code?
   `<p class="muted">Auf dem neuen Gerät den <b>Link</b> öffnen oder den <b>QR-Code</b> scannen – fertig, ein Token muss dort nie getippt werden.</p>
    <div class="row"><button class="primary" id="ac_qr">QR-Code zeigen</button><button id="ac_link">Link kopieren</button><button id="ac_link2">Link ohne Code kopieren</button></div>
    <p class="muted" style="margin:12px 0 4px">Dein Code (zum „Link ohne Code“):</p>
    <div class="codebig">${esc(showCode(code))}</div>
    <div class="row" style="margin-top:8px"><button id="ac_copy">Code kopieren</button><button id="ac_new">Neuen Code erzeugen</button></div>
    <p class="muted" style="margin-top:10px">Der Link enthält deinen Token, verschlüsselt mit dem Code. Wer Link <i>und</i> Code hat, hat vollen Zugriff auf deine Daten. Den „Link ohne Code“ schickst du getrennt vom Code (zwei Kanäle). Zurückziehen kannst du einen Zugang nur, indem du den Token auf GitHub löschst und einen neuen einträgst.</p>`
   :`<p class="muted">Erzeugt einen Code, mit dem sich weitere Geräte (Handy, Tablet, zweiter Rechner) per Link oder QR-Code verbinden – ohne dass du dort Repo und Token tippen musst.</p>
    <div class="row"><button class="primary" id="ac_make">Zugang für weitere Geräte erzeugen</button></div>`);
}

/* ============ Sync & Daten (Dialog) ============ */
function openData(){
  const c=cfg();
  modal(`<h3>Sync & Daten</h3>
  ${c||isLocked()?'':`<h4 style="margin-top:0">Mit Code verbinden</h4>
  <p class="muted">Schon ein Gerät eingerichtet? Dann hier einfach dessen Code eingeben.</p>
  <div class="row"><input id="codeIn" class="codein grow" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-label="Code"><button class="primary" id="codeGo" type="button">Verbinden</button></div>
  <div id="codeMsg"></div>
  <h4>Oder: erstes Gerät mit Repo + Token</h4>`}
  <h4 style="margin-top:0${c||isLocked()?'':';display:none'}">Sync über dein privates GitHub-Repo</h4>
  <p class="muted">Deine Buchungen werden als JSON-Dateien (eine pro Monat) in <b>dein eigenes privates</b> Repo geschrieben. Niemand sonst hat Zugriff, auch nicht der Betreiber dieser App. Auf dem ersten Gerät trägst du Repo + Token ein, alle weiteren verbindest du mit einem Code.</p>
  <div class="field"><label>Daten-Repo (owner/name)</label><input id="s_repo" placeholder="dein-github-name/1percent-data" value="${esc(c?c.repo:'')}" autocapitalize="off" autocomplete="off"></div>
  <div class="field"><label>Zugriffstoken (Fine-grained Personal Access Token)</label><input id="s_tok" type="password" autocomplete="off" placeholder="${c?'gespeichert – leer lassen zum Behalten':'github_pat_…'}"></div>
  <div class="row"><button class="primary" id="s_save">Speichern &amp; testen</button>${c?'<button id="s_now">Jetzt synchronisieren</button><button id="s_off" class="danger">Trennen</button>':''}</div>
  <div id="s_msg" class="muted" style="margin:8px 0">${syncState.s==='err'?'⚠ '+esc(syncState.msg):''}</div>
  <details${c?'':' open'}><summary>So richtest du es ein (einmalig)</summary><ol class="muted">
    <li><a href="https://github.com/new?name=1percent-data&visibility=private" target="_blank" rel="noopener">Privates Repo anlegen</a> (Name z. B. <code>1percent-data</code>, Sichtbarkeit <b>Private</b>)</li>
    <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained Token erstellen</a>: Repository access → <b>Only select repositories</b> → nur dieses Repo; Repository permissions → <b>Contents: Read and write</b></li>
    <li>Token kopieren und oben mit dem Repo-Namen einfügen.</li>
  </ol></details>
  ${c?devicesHTML():''}
  <h4>Claude – Screenshots &amp; PDFs auswerten</h4>
  <p class="muted">Mit deinem eigenen <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Anthropic-API-Schlüssel</a> liest Claude Screenshots, PDFs und Kontoauszüge und ordnet jede Buchung deinen Kategorien zu. Die Kosten laufen über dein Anthropic-Konto – im sparsamen Modus meist unter einem Cent pro Auszug. ${S.ai&&S.ai.key?'Der Schlüssel liegt in deinen synchronisierten Einstellungen, also auf allen verbundenen Geräten.':''}</p>
  <div class="row"><input id="ai_key" type="password" class="grow" autocomplete="off" placeholder="${aiKey()?'gespeichert – zum Ändern neuen Schlüssel eingeben':'sk-ant-…'}"><button id="ai_save" class="primary">Speichern &amp; testen</button>${aiKey()?'<button id="ai_del" class="danger">Entfernen</button>':''}</div>
  <div id="ai_msg" class="muted" style="margin:8px 0">${aiKey()?'✓ Claude ist eingerichtet.':''}</div>
  ${aiKey()?`<div class="field" style="margin:10px 0 4px"><label for="ai_mode">Modell</label><select id="ai_mode"><option value="spar" ${aiMode()==='spar'?'selected':''}>Sparsam – Claude Haiku (Standard, ca. 0,1–0,5 US-Cent pro Auszug)</option><option value="genau" ${aiMode()==='genau'?'selected':''}>Genauer – Claude Sonnet (ca. 20× teurer)</option></select></div>
  <p class="muted" style="margin:4px 0 0">Claude-Kosten diesen Monat auf diesem Gerät: <b>${fmtUsd(aiCostMonth().usd)}</b> (${aiCostMonth().n} Anfrage${aiCostMonth().n===1?'':'n'}, geschätzt aus den gemeldeten Tokens).</p>`:''}
  <h4>Backup</h4>
  <div class="row">
    <button id="d_exp">Als JSON exportieren</button>
    <button id="d_imp">JSON importieren</button>
    <input type="file" id="d_file" accept=".json" hidden>
    <button id="d_csv">Als CSV exportieren</button>
  </div>
  <div class="row" style="margin-top:18px"><button class="danger" id="d_wipe">Alle Buchungen löschen</button><span class="grow"></span><button id="d_close">Schließen</button></div>`,'md');
  $('#d_close').onclick=closeModal;
  if(!c&&!isLocked()){const inp=$('#codeIn');inp.oninput=()=>{if(!/[#&?=]|http/i.test(inp.value))inp.value=showCode(inp.value)};inp.onkeydown=e=>{if(e.key==='Enter')submitCode(inp.value)};$('#codeGo').onclick=()=>submitCode(inp.value)}
  $('#s_save').onclick=async()=>{
    const repo=$('#s_repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),token=$('#s_tok').value.trim()||(c?c.token:'');
    const msg=$('#s_msg');
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){msg.textContent='Bitte Repo (owner/name) und Token angeben.';return}
    msg.textContent='Prüfe Zugriff…';
    const err=await connect(repo,token);
    if(err)msg.textContent=err;else{closeModal();toast('Verbunden – synchronisiere…')}
  };
  if(c){
    $('#s_now').onclick=()=>{closeModal();syncNow()};
    $('#s_off').onclick=()=>{if(confirm('Sync trennen? Die Daten bleiben lokal in diesem Browser und in deinem Daten-Repo erhalten, der Token wird hier entfernt.')){localStorage.removeItem(CFG_KEY);R={};persistR();closeModal();setSync('off');render()}};
    const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
    const refresh=()=>{if($('#ac_state'))openData()};
    const mk=async()=>{const old=S.access&&S.access.id;S.access={code:newCode(),t:Date.now()};accessErr='';save();openData();await publishAccess(true);if(old)removeAccess(old);refresh()};

    on('#ac_new',()=>{if(confirm('Neuen Code erzeugen? Der alte Code funktioniert dann nicht mehr. Schon verbundene Geräte bleiben verbunden.'))mk()});
    on('#ac_retry',async()=>{const b=$('#ac_retry');if(b){b.disabled=true;b.textContent='Prüfe…'}await publishAccess(true);refresh()});
    on('#ac_copy',()=>copyText(showCode(S.access.code),'Code kopiert'));
    on('#ac_link',async()=>copyText(accessErr==='noperm'?await pairLink(true):codeLink(S.access.code),'Link kopiert'));

    const k=$('#ai_key').value.trim(),m=$('#ai_msg');
    if(!k){m.textContent=aiKey()?'✓ Claude ist eingerichtet.':'Bitte einen API-Schlüssel eingeben.';return}
    m.textContent='Prüfe Schlüssel…';const err=await testAiKey(k);
    if(err){m.textContent='⚠ '+err;return}
    S.ai={key:k,t:Date.now(),mode:aiMode()};aiModel=null;save();m.textContent='✓ Gespeichert – Claude wertet ab jetzt Importe aus.';$('#ai_key').value='';
  };
  if($('#ai_mode'))$('#ai_mode').onchange=e=>{S.ai={...S.ai,mode:e.target.value};aiModel=null;save();toast(e.target.value==='genau'?'Claude Sonnet: genauer, aber teurer':'Claude Haiku: sparsam')};
  if($('#ai_del'))$('#ai_del').onclick=()=>{if(confirm('Claude-Schlüssel entfernen? Er wird auch auf deinen anderen Geräten entfernt.')){S.ai=null;save();openData()}};
  $('#d_exp').onclick=()=>download('1percent-daten.json',JSON.stringify({tx:S.tx.map(normTx),cats:S.cats,rules:S.rules},null,2),'application/json');
  $('#d_csv').onclick=()=>download('1percent.csv','Datum;Beschreibung;Betrag;Kategorie;Konto;Notiz\n'+[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[dateDE(t.date),`"${t.desc.replace(/"/g,'""')}"`,t.amount.toFixed(2).replace('.',','),t.category,t.account||'',`"${(t.note||'').replace(/"/g,'""')}"`].join(';')).join('\n'),'text/csv;charset=utf-8');
  $('#d_imp').onclick=()=>$('#d_file').click();
  $('#d_file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{applyData(JSON.parse(await f.text()));closeModal()}catch(err){toast('Ungültige Datei')}};
  $('#d_wipe').onclick=()=>{if(confirm('Wirklich ALLE Buchungen löschen? Das wird auch in dein Daten-Repo synchronisiert.')){S.tx=[];save();closeModal();render()}};
}
function applyData(d){
  if(!d||!Array.isArray(d.tx))throw new Error('format');
  const items=d.tx.filter(t=>t&&t.date&&typeof t.amount==='number').map(t=>({...t,id:t.id||uid(),category:t.category||''}));
  const ids=new Set(items.map(t=>t.id));
  S.tomb=S.tomb.filter(t=>!ids.has(t.id));
  const map=new Map(S.tx.map(t=>[t.id,t]));items.forEach(t=>map.set(t.id,t));
  S.tx=[...map.values()];
  if(Array.isArray(d.cats)&&Array.isArray(d.rules)){S.cats=d.cats;S.rules=d.rules}
  save();render();toast(items.length+' Buchungen geladen');
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ============ Neue Version erkennen ============
   GitHub Pages und Browser halten die Seite gern im Cache (besonders die App auf dem Home-Bildschirm).
   Die App lädt deshalb ab und zu die aktuelle index.html, vergleicht APP_VERSION und bietet das Neuladen an. */
let updShown=false,updLast=0;
async function checkUpdate(){
  if(updShown||location.protocol==='file:'||Date.now()-updLast<60000)return;updLast=Date.now();
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=/const APP_VERSION='([^']+)'/.exec(await r.text());
    if(m&&m[1]!==APP_VERSION){updShown=true;const b=document.createElement('div');b.className='updbar';
      b.innerHTML='Neue Version von 1Percent verfügbar <button class="primary">Jetzt laden</button>';
      b.querySelector('button').onclick=()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash);document.body.appendChild(b)}
  }catch(e){}
}

$('#home').onclick=goHome;$('#home').onkeydown=e=>{if(e.key==='Enter')goHome()};
$('#btnAdd').onclick=()=>view==='todo'?($('#tdIn')&&$('#tdIn').focus()):view==='workout'?editWorkout(null):editTx(null);
$('#btnImport').onclick=openImport;
$('#syncBtn').onclick=openData;
asstInit();
render();
startAccess();
if(cfg())syncNow().then(()=>publishAccess()).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncNow();checkUpdate()}});
checkUpdate();setInterval(checkUpdate,10*60000);
addEventListener('online',syncNow);
const POLL_MS=5000;
function pollTick(){if(cfg()&&!document.hidden&&!syncing&&Date.now()>=backoffUntil)syncNow(true)}
setInterval(pollTick,POLL_MS);
